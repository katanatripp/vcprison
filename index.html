<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tripp is king</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      color: #2a2a2a;
      background: #b9b5a8;
      background-image:
        repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 60px);
      min-height: 100vh;
    }

    .banner {
      background: #1a1a1a;
      color: #d8d2c2;
      padding: 18px 10px;
      text-align: center;
      border-top: 6px solid #000;
      border-bottom: 6px solid #000;
      background-image:
        repeating-linear-gradient(90deg, #444 0 3px, transparent 3px 40px);
    }

    .banner span {
      display: inline-block;
      background: #1a1a1a;
      padding: 4px 22px;
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 30px;
      background: #ded9c9;
      border: 2px solid #2a2a2a;
      box-shadow: 6px 6px 0 #2a2a2a;
      text-align: center;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 1.15rem;
      font-weight: bold;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    button {
      font-family: inherit;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #2a2a2a;
      padding: 12px 40px;
      border: 2px outset #c9c4b4;
      border-radius: 0;
      background: #c9c4b4;
      cursor: pointer;
    }

    button:hover {
      background: #cfcabb;
    }

    button:active {
      border-style: inset;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #counter {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #4a4a4a;
    }
  </style>
</head>
<body>
  <div class="banner"><span>Coming Soon</span></div>

  <main>
    <div class="card">
      <h1>say f u to the web master below!</h1>

      <button id="fuckuBtn">F u</button>
      <div id="counter">f u'd 0 times</div>
    </div>
  </main>

  <script>
    const button = document.getElementById('fuckuBtn');
    const counter = document.getElementById('counter');

    async function updateCounter() {
      try {
        const res = await fetch('/api/counter-ry');
        const data = await res.json();
        if (!res.ok || typeof data.count !== 'number') throw new Error(data.error || 'bad response');
        counter.textContent = `f u'd ${data.count} ${data.count === 1 ? 'time' : 'times'}`;
      } catch (err) {
        counter.textContent = 'Error loading count :(';
        console.error(err);
      }
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const res = await fetch('/api/counter-ry', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || typeof data.count !== 'number') throw new Error(data.error || 'bad response');
        counter.textContent = `Pressed ${data.count} ${data.count === 1 ? 'time' : 'times'}`;
      } catch (err) {
        counter.textContent = 'Error updating count :(';
        console.error(err);
      } finally {
        button.disabled = false;
      }
    });

    updateCounter();
  </script>
</body>
</html>
