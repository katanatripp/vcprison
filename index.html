<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VCPrison is coming back</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      color: #2a2a2a;
      background: #b9b5a8;
      background-image:
        repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 60px);
      min-height: 100vh;
    }

    .banner {
      background: #1a1a1a;
      color: #d8d2c2;
      padding: 18px 10px;
      text-align: center;
      border-top: 6px solid #000;
      border-bottom: 6px solid #000;
      background-image:
        repeating-linear-gradient(90deg, #444 0 3px, transparent 3px 40px);
    }

    .banner span {
      display: inline-block;
      background: #1a1a1a;
      padding: 4px 22px;
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .subbanner {
      margin: 14px 0 0;
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: #4a4a4a;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 30px;
      background: #ded9c9;
      border: 2px solid #2a2a2a;
      box-shadow: 6px 6px 0 #2a2a2a;
      text-align: center;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 1.15rem;
      font-weight: bold;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    button {
      font-family: inherit;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #2a2a2a;
      padding: 12px 40px;
      border: 2px outset #c9c4b4;
      border-radius: 0;
      background: #c9c4b4;
      cursor: pointer;
    }

    button:hover {
      background: #cfcabb;
    }

    button:active {
      border-style: inset;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #counter {
      margin-top: 20px;
      font-size: 0.95rem;
      color: #4a4a4a;
    }

    .discord-link {
      display: block;
      margin-top: 14px;
      font-size: 0.9rem;
      color: #2a2a2a;
      text-decoration: underline;
    }

    .discord-link[hidden] {
      display: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay[hidden] {
      display: none;
    }

    .popup {
      position: relative;
      width: 100%;
      max-width: 340px;
      padding: 32px 26px;
      background: #ded9c9;
      border: 2px solid #2a2a2a;
      box-shadow: 6px 6px 0 #2a2a2a;
      text-align: center;
    }

    .popup h2 {
      margin: 0 0 22px;
      font-size: 1.05rem;
      font-weight: bold;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .popup a.button {
      display: inline-block;
      font-family: inherit;
      font-weight: bold;
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      color: #2a2a2a;
      text-decoration: none;
      padding: 12px 34px;
      border: 2px outset #c9c4b4;
      background: #c9c4b4;
    }

    .popup a.button:hover {
      background: #cfcabb;
    }

    .popup a.button:active {
      border-style: inset;
    }

    .popup-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9rem;
      line-height: 1;
      color: #2a2a2a;
      padding: 0;
      border: 2px outset #c9c4b4;
      background: #c9c4b4;
      cursor: pointer;
    }

    .popup-close:active {
      border-style: inset;
    }
  </style>
</head>
<body>
  <div class="overlay" id="discordOverlay">
    <div class="popup">
      <button class="popup-close" id="discordClose" aria-label="Close">&times;</button>
      <h2>join the discord</h2>
      <a class="button" href="/discord" target="_blank" rel="noopener">Join Discord</a>
    </div>
  </div>

  <div class="banner"><span>Coming Soon</span></div>
  <p class="subbanner">VC Prison is coming back soon...</p>

  <main>
    <div class="card">
      <h1>say f u to the web master below!</h1>

      <button id="fuckuBtn">F u</button>
      <div id="counter">f u'd 0 times</div>
      <a id="discordLink" class="discord-link" href="/discord" target="_blank" rel="noopener" hidden>click to join the discord</a>
    </div>
  </main>

  <script>
    const button = document.getElementById('fuckuBtn');
    const counter = document.getElementById('counter');
    const discordLink = document.getElementById('discordLink');

    async function updateCounter() {
      try {
        const res = await fetch('/api/counter-ry');
        const data = await res.json();
        if (!res.ok || typeof data.count !== 'number') throw new Error(data.error || 'bad response');
        counter.textContent = `f u'd ${data.count} ${data.count === 1 ? 'time' : 'times'}`;
      } catch (err) {
        counter.textContent = 'Error loading count :(';
        console.error(err);
      }
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const res = await fetch('/api/counter-ry', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || typeof data.count !== 'number') throw new Error(data.error || 'bad response');
        counter.textContent = `Pressed ${data.count} ${data.count === 1 ? 'time' : 'times'}`;
        discordLink.hidden = false;
      } catch (err) {
        counter.textContent = 'Error updating count :(';
        console.error(err);
      } finally {
        button.disabled = false;
      }
    });

    updateCounter();

    const discordOverlay = document.getElementById('discordOverlay');
    const discordClose = document.getElementById('discordClose');

    if (!sessionStorage.getItem('discordPopupDismissed')) {
      discordOverlay.hidden = false;
    } else {
      discordOverlay.hidden = true;
    }

    function dismissDiscordPopup() {
      discordOverlay.hidden = true;
      sessionStorage.setItem('discordPopupDismissed', '1');
    }

    discordClose.addEventListener('click', dismissDiscordPopup);
    discordOverlay.addEventListener('click', (e) => {
      if (e.target === discordOverlay) dismissDiscordPopup();
    });
  </script>
</body>
</html>
